[project]
name = "concert-db"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.184.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.2",
    "ruff>=0.13.1",
    "sqlalchemy>=2.0.43",
    "textual>=6.1.0",
]
[dependency-groups]
dev = [
    "ipython>=9.5.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ty>=0.0.111",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["SIM", "I", "ARG", "E", "W", "F", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
